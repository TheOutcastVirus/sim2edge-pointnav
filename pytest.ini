[pytest]
testpaths = tests
python_files = test_*.py
# ROS 2 installs a `launch_testing` pytest plugin whose hook signature is
# incompatible with modern pytest; it breaks collection before any test runs.
# Nothing here uses it, so it is disabled via addopts.
addopts = -q -p no:launch_testing -p no:launch_ros
filterwarnings =
    ignore::DeprecationWarning
