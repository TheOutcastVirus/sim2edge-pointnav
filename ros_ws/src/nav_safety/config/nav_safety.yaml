# Safety layer configuration.
#
# Defaults come from sim2edge/spec.py via spec_generated.hpp. Overriding them
# here breaks the correspondence with the simulator's SafetyLayer, which is what
# makes sim and hardware intervention counts comparable -- prefer changing the
# spec and regenerating.
/**:
  ros__parameters:
    cmd_in_topic: /nav_policy/cmd_raw
    cmd_out_topic: /cmd_vel
    scan_topic: /scan
    status_topic: ~/status
    interventions_topic: ~/interventions

    # Lidar bubble, forward sector only.
    stop_distance: 0.30      # v := 0 (rotation still permitted)
    slow_distance: 0.60      # scale v down linearly toward stop_distance
    forward_sector: 0.61     # +/-35 degrees

    # Watchdogs. No command or no scan for this long => zero Twist.
    policy_timeout: 0.5
    lidar_max_age: 0.15

    control_rate: 20.0

    # false = dry run: computes and logs commands but never publishes /cmd_vel.
    # Use for the first bring-up on a new layout.
    publish_cmd_vel: true
