[project]
name = "sim2edge"
version = "0.1.0"
description = "Goal-conditioned navigation: Isaac Lab -> BC/PPO -> ExecuTorch on QCS8275"
requires-python = ">=3.10"

# Deliberately small. Anything imported by `sim2edge.spec` must be stdlib only
# (see the module docstring), and anything imported by the CPU-side layout
# builder must not require CUDA, so a laptop can build a layout pool.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",   # exact EDT only; sim-side, never crosses to the board
    "torch>=2.4",    # batched oracle / preprocessing / noise; CPU is fine for tests
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim2edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Torch-dependent tests skip cleanly when torch is absent, so the numpy core
# stays testable on a machine that has not installed the GPU stack.
markers = [
    "torch: requires torch",
]
